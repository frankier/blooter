# blooter configuration file.
#
# Search order: the -c <file> command-line option, then
# $XDG_CONFIG_HOME/blooter/config.toml (falling back to
# ~/.config/blooter/config.toml), then /etc/blooter/config.toml.
#
# Each hotkey is a chord: zero or more modifier names followed by one trigger
# key, joined with '+'. The first key listed must be pressed first — that is
# what starts the chord — and the rest may then be pressed in any order. The
# chord fires as soon as its last key goes down, and none of its keys are
# forwarded to the host. A key is only held back while it may still be part of
# a chord: one that begins no chord, or one whose chord turns out not to be
# coming, is forwarded as usual. When one chord's keys are a subset of
# another's, the shorter one fires first and shadows the longer.
#
# Key names follow keyd (https://github.com/rvaiya/keyd), e.g. "scrolllock",
# "pause", "f12", "kpenter", "leftcontrol", "rightmeta". The side-agnostic
# modifier aliases "control"/"ctrl", "shift", "alt" and "meta"/"super" match
# whichever side is held. Set a hotkey to "" to disable it.
#
# The values below are the built-in defaults, shown commented out.

[hotkeys]

# Drop the current host session and return to accepting connections — which on
# BLE also brings the bonded-host menu back, since a connected host preempts it
# and a bonded host reconnects by itself (design/CONNECTION.md §6.2). Set to ""
# to disable.
#drop_connection = "leftcontrol+leftalt+leftshift"

# Terminate blooter cleanly.
#exit = "leftcontrol+leftalt+rightshift"

# Toggle input capture. While capture is off, events are not forwarded to the
# host (an all-keys-up report is sent first), and devices grabbed exclusively
# with -x are released so input reaches the local session again. Hotkeys stay
# active while capture is off; a new host connection re-enables capture.
#capture_toggle = "leftshift+rightshift"

# Separate capture on/off chords, if you prefer them over (or in addition to)
# the toggle. Disabled by default.
#capture_on = ""
#capture_off = ""

[gamepad]

# How many gamepad controllers to advertise to the host. Each controller gets
# its own HID report ID, so the host sees them as separate gamepads. The number
# advertised is fixed when blooter registers and cannot change while running,
# but the advertised slots can be filled and refilled at runtime (see hotplug).
#
#   "initial"  one controller per gamepad present at startup (the default)
#   0          disable gamepad forwarding entirely
#   N          advertise exactly N controllers (present gamepads fill slots in
#              order; any extra slots stay idle, ready for hotplug)
#
# Changing this changes the HID report descriptor, which hosts cache for the
# lifetime of their bond: an already-paired host keeps using the layout it
# cached and will not see the change until it is re-paired. blooter warns about
# such hosts at startup and can fix them ([f] in the connection menu; see
# design/CONNECTION.md §7). A fixed count keeps the descriptor stable from run
# to run, whereas "initial" re-derives it from whatever is plugged in at
# startup — so prefer a fixed count if you pair with many hosts.
#slots = "initial"

# Whether to open gamepads plugged in after startup, filling free advertised
# slots (and reusing slots freed when a controller is unplugged) via a udev
# monitor. With an explicit -e selection, only listed event numbers are opened.
#
#   "auto"  on when slots is a fixed count > 0, off otherwise (the default)
#   "on"    always monitor (no effect unless a slot is free)
#   "off"   never monitor
#hotplug = "auto"

[connection]

# Which Bluetooth transport to present the device over. The input pipeline is
# identical either way; only how reports are delivered and how the device is
# discovered differ (see design/ARCH.md §4).
#
#   "ble"      Bluetooth Low Energy (HID-over-GATT / HOGP), the default.
#              Registers a GATT server and an LE advertisement; no
#              `bluetoothd -P input` and no privileged port bind required.
#   "classic"  Bluetooth Classic (BR/EDR) HID. Needs `bluetoothd -P input` and
#              privilege to bind the HID L2CAP PSMs.
#protocol = "ble"

# How the pairing agent answers bonding requests (see design/CONNECTION.md §5).
#
#   "accept"              accept every pairing request silently ("Just Works"),
#                         the default
#   "prompt_if_possible"  prompt on the terminal when stdin is a TTY, else
#                         accept silently
#   "prompt"              always prompt on the terminal before bonding; blooter
#                         refuses to start if stdin is not a TTY
#pairing = "accept"

# Address of a host to initiate an outgoing connection to on startup
# (reconnect-initiate; see design/CONNECTION.md §3.2). Only used if that host is
# already bonded. When unset, blooter waits for the host to connect (in
# interactive mode the host menu can pick a target at runtime instead). Once any
# link is up the target is cleared, so blooter does not fight an intentional
# disconnect.
#
# Classic only. Over BLE blooter is the peripheral and the host is the central,
# so only the host can open a link; setting this with protocol = "ble" logs a
# warning and is ignored. A bonded host reconnects to blooter's advertisement by
# itself (design/CONNECTION.md §4).
#reconnect = "AA:BB:CC:DD:EE:FF"

[ble]

# How much of the adapter's identity blooter takes over in BLE mode
# (design/CONNECTION.md §4.1).
#
# The name and appearance in the LE advertisement only reach a host *before* it
# connects. Once connected the host reads bluetoothd's GAP service, whose Device
# Name comes from the adapter's alias and whose Appearance is derived from the
# adapter's Class of Device — so without setting those, a host shows the
# machine's hostname and its computer icon no matter what blooter advertises.
#
# The alias needs no privilege; the Class of Device goes through the Bluetooth
# management socket and needs CAP_NET_ADMIN. Both are restored on exit.
#
#   "auto"            set the alias and, if permitted, the Class of Device;
#                     carry on quietly without the class if not — the default
#   "alias"           set the alias only, so hosts show the right name but the
#                     adapter keeps its existing device icon
#   "alias_cod"       set both, and refuse to start if the class cannot be set
#   "alias_cod_hide"  as "alias_cod", plus turn off BR/EDR discoverability so
#                     only the LE identity is on offer
#advertise = "auto"

[pointer]

# Mice and touchpads generate events far faster than a Bluetooth link consumes
# them — a touchpad can emit hundreds of frames a second, while BLE delivers
# roughly one notification per connection interval. Left unbatched, motion
# queues up and the pointer keeps gliding after you stop. blooter accumulates
# the motion in a frame and sends it as one larger report instead, trading a
# little pointer resolution for responsiveness (see design/ARCH.md §7.2c).
#
# What triggers a send. An input frame boundary (SYN_REPORT) is required in
# every mode, so a report never splits a frame.
#
#   "auto"      wait at least one transport-specific interval between pointer
#               reports — 8 ms on Classic, 15 ms on BLE (the default)
#   "adaptive"  no timer: merge whatever piled up while the previous report was
#               being sent. Zero added latency, and genuinely backpressure-driven
#               on Classic. On BLE a notification is handed to bluetoothd rather
#               than paced by the radio, so there it only merges opportunistically
#               and will not throttle to the connection interval — prefer "auto"
#   "none"      no batching: send at every frame boundary
#   N           wait at least N milliseconds, overriding what "auto" would pick
#batch = "auto"

# How many outgoing reports to hold per connection. Allocated once when a host
# connects. Pointer motion merges in place rather than filling slots, so this
# only bounds bursts of keyboard, gamepad and unmergeable pointer reports; the
# buffer is always flushed before it can overflow, so nothing is dropped.
#buffer = 16

# Width of the relative X/Y fields in the HID report descriptor. 8-bit caps a
# single report at ±127 counts, which merged motion can exceed during a fast
# flick; 16-bit (±32767) makes batching lossless at any interval.
#
# This changes the HID report descriptor, which hosts cache for the lifetime of
# their bond — the same caveat as [gamepad] slots. On Classic, blooter notices
# and offers [f] in the connection menu (design/CONNECTION.md §7). On BLE there
# is no such repair: a host bonded under the other width keeps its cached Report
# Map and will misread the reports, so re-pair it by hand after changing this.
#axis_bits = 8

# What to do when merged motion exceeds what one report can carry.
#
#   "burst"  send as many back-to-back reports as it takes (the default).
#            Lossless, and bounded by the buffer above
#   "carry"  send one saturated report and carry the remainder into the next
#            frame. Smoother, but a fast flick lags slightly behind
#   "clamp"  send one saturated report and discard the remainder. The pointer
#            travels less than you moved
#
# With axis_bits = 16 this effectively never comes into play.
#overflow = "burst"

[remote]

# TV-remote emulation: an extra HID Consumer Control collection, which is what
# every Bluetooth TV remote is under the hood. See design/REMOTE.md for the full
# button table and for what each kind of host actually does with it.
#
# This changes the HID report descriptor, which hosts cache for the lifetime of
# their bond — the same caveat as [gamepad] slots and [pointer] axis_bits. An
# already-paired host keeps using the layout it cached and will ignore every
# remote button until it re-reads the descriptor: fix it with [f] in the
# connection menu, or re-pair (design/CONNECTION.md §7). While this is false the
# descriptor is exactly what it was without this section, so leaving it off
# costs existing hosts nothing.
#enabled = false

# Forward the multimedia keys the local keyboard already has — volume, mute,
# play/pause, next, previous, search, home, back — which are otherwise dropped
# for being outside the keyboard usage range. Set it to false for a pure virtual
# remote, when those keys should keep controlling the local machine.
#passthrough = true

# Bindings for the remote buttons a keyboard has no key for. Same syntax as
# [hotkeys]: the binding name is the key, the chord is the value, "" disables.
# Chords rather than bare keys, because blooter forwards every key — stealing a
# bare key to mean "channel up" would be a regression, while a chord stays
# invisible to the host until it fires. A fired binding is a tap (press then
# release), so it never autorepeats: channel-surfing means repeating the chord.
#
# Recognized names: tv, guide, dvr, channel_up, channel_down, last_channel,
# captions, info, red, green, yellow, blue, aspect_ratio, all_apps. All are
# unbound by default.
#tv            = "leftmeta+t"
#guide         = "leftmeta+g"
#channel_up    = "leftmeta+pageup"
#channel_down  = "leftmeta+pagedown"
#last_channel  = "leftmeta+l"
#captions      = "leftmeta+c"
#dvr           = "leftmeta+d"
#info          = "leftmeta+i"
#red           = "leftmeta+f1"
#green         = "leftmeta+f2"
#yellow        = "leftmeta+f3"
#blue          = "leftmeta+f4"
#all_apps      = "leftmeta+a"
#aspect_ratio  = "leftmeta+r"

# Escape hatch for any Consumer-page usage in 0x000..=0x2A2 that has no name
# above. Best-effort by definition: 0x082 (Mode Step) is the nearest thing to
# "cycle TV input", but Android TV drops it, which is why it has no friendly
# name (design/REMOTE.md §2.1). At most 24 bindings in total.
#"usage:0x082" = "leftmeta+s"
