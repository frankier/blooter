[package]
name = "blooter"
version = "0.1.0"
edition = "2024"

[dependencies]
bluer = { version = "0.17.4", default-features = false, features = ["bluetoothd", "l2cap", "rfcomm"] }
crossterm = { version = "0.28", default-features = false, features = ["events", "event-stream"] }
env_logger = { version = "0.11.11", default-features = false, features = [] }
evdev = { version = "0.13.2", features = ["tokio"] }
futures = "0.3.33"
libc = "0.2.186"
log = "0.4.33"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
toml-spanner = "1.0.3"
udev = { version = "0.9", default-features = false, features = ["send", "sync"] }

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
strip = true
panic = "abort"
