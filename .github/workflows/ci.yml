name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned so the cached ~/.cargo/bin/termwright is invalidated on a bump.
  TERMWRIGHT_VERSION: "0.2.0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  # Both integration suites need a VM: AF_BLUETOOTH only works in the initial
  # netns and the HID PSMs need CAP_NET_BIND_SERVICE in the initial userns
  # (tests/README.md). virtme-ng boots the runner's own kernel, so the guest
  # needs that kernel's bluetooth modules -- hence linux-modules-extra.
  btvirt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            virtme-ng qemu-system-x86 "linux-modules-extra-$(uname -r)" \
            bluez dbus-daemon \
            libglib2.0-dev libdbus-1-dev libudev-dev pkg-config
          # vng -r boots the running host kernel, so it has to be readable.
          sudo chmod 0644 "/boot/vmlinuz-$(uname -r)"
      - name: Preflight
        run: |
          uname -r; ls -l /dev/kvm
          modinfo hci_vhci || { echo "MISSING: no hci_vhci for this kernel"; exit 1; }
          vng -r --user root -e 'modprobe hci_vhci && ls -l /dev/vhci && echo VHCI-OK'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # build-btvirt.sh short-circuits once emulator/btvirt exists, so a hit
      # makes its whole fetch+configure+make step a no-op.
      - name: Cache btvirt build
        uses: actions/cache@v4
        with:
          path: tests/btvirt/build
          key: btvirt-${{ hashFiles('tests/btvirt/build-btvirt.sh') }}
      - run: ./tests/btvirt/run.sh

  termdbus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            virtme-ng qemu-system-x86 "linux-modules-extra-$(uname -r)" \
            dbus-daemon python3-dbus python3-dbusmock \
            libfontconfig1-dev libdbus-1-dev libudev-dev pkg-config
          sudo chmod 0644 "/boot/vmlinuz-$(uname -r)"
      - name: Preflight
        run: |
          uname -r; ls -l /dev/kvm
          vng -r --user root -e 'python3 -c "import dbusmock; print(\"DBUSMOCK-OK\")"'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # termwright is a slow from-source build (font-kit/fontconfig); cache the
      # installed binary rather than rebuilding it every run.
      - name: Cache termwright
        id: termwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/termwright
          key: termwright-${{ env.TERMWRIGHT_VERSION }}
      - if: steps.termwright-cache.outputs.cache-hit != 'true'
        run: cargo install termwright --version ${{ env.TERMWRIGHT_VERSION }}
      - run: ./tests/termdbus/run.sh
