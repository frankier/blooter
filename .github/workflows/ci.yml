name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned so the cached ~/.cargo/bin/termwright is invalidated on a bump.
  TERMWRIGHT_VERSION: "0.2.0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  # Both integration suites need a VM: AF_BLUETOOTH only works in the initial
  # netns and the HID PSMs need CAP_NET_BIND_SERVICE in the initial userns
  # (tests/README.md). The runner's own kernel (linux-azure) has no hci_vhci and
  # no bluetooth modules at all, so both jobs install Ubuntu's generic kernel and
  # point vng at it with $VNG_KERNEL; only its modules are used, the runner keeps
  # running the kernel it booted.
  btvirt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            virtme-ng qemu-system-x86 linux-image-generic \
            bluez dbus-daemon \
            libglib2.0-dev libdbus-1-dev libreadline-dev libudev-dev pkg-config
          # linux-image-generic pulls the matching linux-modules-extra, which is
          # where hci_vhci and the rest of the bluetooth stack live.
          KVER=$(ls -1 /lib/modules | grep -- -generic | sort -V | tail -1)
          sudo chmod 0644 "/boot/vmlinuz-$KVER"   # vng has to read the image
          echo "VNG_KERNEL=$KVER" >> "$GITHUB_ENV"
      - name: Preflight
        run: |
          ls -l /dev/kvm; echo "guest kernel: $VNG_KERNEL"
          modinfo -k "$VNG_KERNEL" hci_vhci >/dev/null \
            || { echo "MISSING: no hci_vhci for $VNG_KERNEL"; exit 1; }
          # A script rather than an inline command: vng -e goes through the
          # guest's /bin/sh, where quoting a snippet is a minefield.
          cat > "$RUNNER_TEMP/probe.sh" <<'EOF'
          #!/bin/sh
          set -e
          uname -r
          modprobe hci_vhci
          ls -l /dev/vhci
          echo VHCI-OK
          EOF
          chmod +x "$RUNNER_TEMP/probe.sh"
          vng -r "$VNG_KERNEL" --user root -e "$RUNNER_TEMP/probe.sh"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # build-btvirt.sh short-circuits once all three binaries exist, so a hit
      # makes its whole fetch+configure+make step a no-op. The key hashes the
      # script, so adding a build target invalidates it.
      - name: Cache btvirt build
        uses: actions/cache@v4
        with:
          path: tests/btvirt/build
          key: btvirt-${{ hashFiles('tests/btvirt/build-btvirt.sh') }}
      - run: ./tests/btvirt/run.sh

  termdbus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            virtme-ng qemu-system-x86 linux-image-generic \
            dbus-daemon python3-dbus \
            libfontconfig1-dev libdbus-1-dev libudev-dev pkg-config
          # Not python3-dbusmock: noble ships 0.31, whose bluez5 template has no
          # LEAdvertisingManager1, so blooter's (now default) LE transport cannot
          # register an advertisement. Take it from PyPI instead -- it is pure
          # Python, and run.sh forwards the --user site dir into the guest.
          pip install --user --break-system-packages 'python-dbusmock>=0.38'
          KVER=$(ls -1 /lib/modules | grep -- -generic | sort -V | tail -1)
          sudo chmod 0644 "/boot/vmlinuz-$KVER"
          echo "VNG_KERNEL=$KVER" >> "$GITHUB_ENV"
      - name: Preflight
        run: |
          ls -l /dev/kvm; echo "guest kernel: $VNG_KERNEL"
          python3 -c "import dbusmock; print('dbusmock', dbusmock.__version__, dbusmock.__file__)"
          vng -r "$VNG_KERNEL" --user root -e /bin/uname
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # termwright is a slow from-source build (font-kit/fontconfig); cache the
      # installed binary rather than rebuilding it every run.
      - name: Cache termwright
        id: termwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/termwright
          key: termwright-${{ env.TERMWRIGHT_VERSION }}
      - if: steps.termwright-cache.outputs.cache-hit != 'true'
        run: cargo install termwright --version ${{ env.TERMWRIGHT_VERSION }}
      - run: ./tests/termdbus/run.sh
